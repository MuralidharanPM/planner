<h2 mat-dialog-title>Add Task</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="width-100-percent">
    <input matInput placeholder="Task name" [(ngModel)]="taskName">
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button (click)="save()">Save</button>
</mat-dialog-actions>
