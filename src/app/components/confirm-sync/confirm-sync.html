<h2 mat-dialog-title>Confirm Syncing</h2>

<mat-dialog-content>
  Are you sure you want to sync up the task for today
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button mat-dialog-close (click)="cancel()">No</button>
  <button mat-button color="primary" mat-dialog-close (click)="confirm()">Yes</button>
</mat-dialog-actions>
